mode: rule
ipv6: false
allow-lan: false
tproxy-port: 1536
log-level: silent
unified-delay: true
tcp-concurrent: true
find-process-mode: always
profile:
  store-fake-ip: true
  store-selected: true

#### WebUI ####
secret: "MihomoKSU"
external-ui: ./web/
external-controller: 127.0.0.1:9090
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"

#### Providers ####
p: &p
  proxy: 直连
  health-check:
    lazy: true
    enable: false
    interval: 1800
    url: http://cp.cloudflare.com

proxy-providers:
  Hosted:
    <<: *p
    type: file
    path: ./providers/hosted

  Sub:
    <<: *p
    type: http
    path: ./providers/sub
    filter: "^(?!.*(Expire|GB|Reset)).*$"
    url: "***"

man: &man
  type: select
  use:
    - Sub

min: &min
  type: select
  use:
    - Hosted

#### Tun ####
tun:
  enable: false
  stack: system
  device: mihomo
  dns-hijack:
    - any:53
    - tcp://any:53
  gso: true
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  disable-icmp-forwarding: true
  exclude-package:
    - org.localsend.localsend_app

#### Sniff ####
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 5228]
  skip-domain:
    - "+.amemv.com"
    - "+.douyinvod.com"
    - "+.douyinpic.com"
    - "+.huoshanimg.com"
    - "+.douyinstatic.com"

#### DNS ####
dns:
  ipv6: false
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:ban-ads"
    - "rule-set:ban-ad"
  nameserver:
    - tcp://1.1.1.1#DNS
  default-nameserver:
    - udp://223.5.5.5#直连
  proxy-server-nameserver:
    - quic://223.5.5.5#直连
  direct-nameserver:
    - quic://223.5.5.5#直连
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:ban-ads,ban-ad":
      - rcode://name_error

#### Proxies ####
proxies:
  - { name: 直连, type: direct, udp: true }
  - { name: 屏蔽, type: reject }
  - { name: DNS-IN, type: dns }

cn_man: &cn_man
  type: select
  proxies:
    - 直连
    - 默认
    - 香港
    - 台湾
    - 新加坡
    - 美国
    - 日本
    - 备用

proxy_gen: &proxy_gen
  type: select
  proxies:
    - 默认
    - 直连

proxy-groups:
  - name: 默认
    type: select
    proxies:
      - 香港
      - 台湾
      - 新加坡
      - 美国
      - 日本
      - 备用
      - 直连

  - name: 香港
    filter: "^(?=.*(Hong)).*$"
    <<: *man

  - name: 台湾
    filter: "^(?=.*(Taiwan)).*$"
    <<: *man

  - name: 新加坡
    filter: "^(?=.*(Singapore)).*$"
    <<: *man

  - name: 美国
    filter: "^(?=.*(United)).*$"
    <<: *man

  - name: 日本
    filter: "^(?=.*(Japan)).*$"
    <<: *man

  - name: 备用
    <<: *min

  #### Groups ####
  - name: DNS-OUT
    type: select
    hidden: true
    proxies:
      - 默认

#### RuleSets ####
rule-anchor:
  user: &user { type: file, behavior: classical, format: text }
  yaml: &yaml { type: http, behavior: classical, format: yaml, proxy: 默认 }
  domain: &domain { type: http, behavior: domain, format: mrs, proxy: 默认 }
  ipcidr: &ipcidr { type: http, behavior: ipcidr, format: mrs, proxy: 默认 }

rule-providers:
  blocked:
    <<: *user
    path: ./custom/blocked.list
  bypass:
    <<: *user
    path: ./custom/bypass.list

  cn:
    <<: *domain
    path: ./rules/domain/cn.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
  cn-ip:
    <<: *ipcidr
    path: ./rules/ipcidr/cn.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

  ban-ad:
    <<: *domain
    path: ./rules/domain/ban-ad.mrs
    url: "https://raw.githubusercontent.com/Xrz324/AdRules/main/adrules-mihomo.mrs"
  ban-ads:
    <<: *yaml
    path: ./rules/yaml/ban-ads.yaml
    url: "https://raw.githubusercontent.com/Xrz324/AdRules/main/adrules-mihomo.yaml"

  private:
    <<: *domain
    path: ./rules/domain/private.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  private-ip:
    <<: *ipcidr
    path: ./rules/ipcidr/private.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"

#### Rules ####
rules:
  # DNS Handle
  - DST-PORT,53,DNS-IN
  - DST-PORT,853,屏蔽

  # Ban QUIC
  - AND,((NETWORK,udp),(DST-PORT,443)),屏蔽

  # Blocking Rules
  - RULE-SET,ban-ads,屏蔽,no-resolve
  - RULE-SET,ban-ad,屏蔽,no-resolve
  - RULE-SET,blocked,屏蔽,no-resolve

  # Addon Rules
  - RULE-SET,bypass,直连,no-resolve
  # - PROCESS-NAME,example.app,直连
  # - UID,10123,直连

  # Domain Rules
  - RULE-SET,private,直连
  - RULE-SET,cn,直连

  # IP Rules
  - RULE-SET,private-ip,直连
  - RULE-SET,cn-ip,直连

  # Missing Handle
  - MATCH,默认
